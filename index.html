<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Čeština k maturitě – procvičování</title>
<style>
/* ======================================================= vzhled */
:root{
  --bg:#f5f4ef; --card:#ffffff; --card2:#faf9f6; --text:#1d2127; --muted:#6a6f78; --line:#e2dfd6;
  --accent:#3e5fd6; --accent-t:#ffffff; --accentbg:#eaeefc;
  --ok:#2b8a3e; --okbg:#e5f5e9; --bad:#d6336c; --badbg:#fcebf1;
  --blue:#1971c2; --bluebg:#e3f0fc; --red:#c92a2a; --redbg:#fdecec; --warn:#b26a00; --warnbg:#fff4e0;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05); --r:16px;
}
:root[data-theme="dark"]{
  --bg:#15171b; --card:#1f2228; --card2:#252932; --text:#e8e9ec; --muted:#9aa1ad; --line:#323743;
  --accent:#7d97ff; --accent-t:#0d1020; --accentbg:#283152;
  --ok:#5fd07c; --okbg:#1d3324; --bad:#ff7aa5; --badbg:#3a1f2a;
  --blue:#6cb4ff; --bluebg:#1c2d42; --red:#ff8787; --redbg:#3b2222; --warn:#ffc061; --warnbg:#3a2e17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171b; --card:#1f2228; --card2:#252932; --text:#e8e9ec; --muted:#9aa1ad; --line:#323743;
    --accent:#7d97ff; --accent-t:#0d1020; --accentbg:#283152;
    --ok:#5fd07c; --okbg:#1d3324; --bad:#ff7aa5; --badbg:#3a1f2a;
    --blue:#6cb4ff; --bluebg:#1c2d42; --red:#ff8787; --redbg:#3b2222; --warn:#ffc061; --warnbg:#3a2e17;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:920px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.2rem;margin:0 0 10px}
h3{font-size:1.02rem;margin:0 0 8px}
p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top .grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:.92rem}
.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card2)}
.seg button{border:0;background:transparent;min-height:46px;padding:8px 14px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-t)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ex{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;min-height:96px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.ex b{font-size:1.02rem}
.ex .n{margin-top:auto;font-size:.82rem;color:var(--muted)}
.ex:disabled{opacity:.45}
.mix{width:100%;min-height:64px;font-size:1.1rem}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:999px;background:var(--bluebg);color:var(--blue);vertical-align:middle;white-space:nowrap}
.tag.red{background:var(--redbg);color:var(--red)}
.tag.gray{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.q{font-size:1.18rem;font-weight:600;margin:6px 0 12px}
.ctx{font-size:.86rem;color:var(--muted);margin-bottom:4px}
blockquote{margin:6px 0 12px;padding:10px 14px;border-left:4px solid var(--accent);background:var(--card2);border-radius:8px;font-size:1.12rem;font-style:italic}
.opts{display:grid;gap:10px}
@media (min-width:700px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{text-align:left;min-height:56px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-size:1.02rem;touch-action:manipulation}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn .opt{text-align:center;font-weight:700;font-size:1.15rem;min-height:64px}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px}
.fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)}
.fb .t{font-weight:700;font-size:1.05rem}
.fb .warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:4px 8px;display:inline-block;font-weight:600;margin:4px 0}
.zdroj{margin-top:8px;font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.zdroj b{color:var(--text);font-weight:600}
.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
input.txt{font:inherit;font-size:1.08rem;width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:var(--text)}
input.txt:focus,input.blank:focus{outline:none;border-color:var(--accent)}
.stat{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 56px;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.weak{background:var(--warnbg);border-radius:12px;padding:10px 12px;margin:8px 0}
ul.clean{margin:4px 0;padding-left:20px}
.list-err{display:grid;gap:10px}
.err{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card2)}
.big-score{font-size:2.4rem;font-weight:800;line-height:1}
/* časová osa */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:10px;border:2px dashed var(--line);border-radius:12px;background:var(--card2);margin-bottom:12px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none;font-size:.95rem;max-width:100%;cursor:grab}
.ev.sel{outline:3px solid var(--accent)}
.ev.dragging{opacity:.35}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.92;transform:rotate(1.5deg);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.axis{position:relative;padding-left:22px}
.axis:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:3px}
.slot{position:relative;display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin:8px 0}
.slot:before{content:"";position:absolute;left:-19px;top:50%;width:11px;height:11px;margin-top:-5px;border-radius:50%;background:var(--accent)}
.slot .rok{font-weight:800;font-size:.98rem}
.slot .misto{min-height:52px;border:2px dashed var(--line);border-radius:10px;padding:4px;display:flex;align-items:center}
.slot .misto:empty:after{content:"sem přetáhni událost";color:var(--muted);font-size:.85rem;padding-left:8px}
.drop.over,.slot.over .misto{border-color:var(--accent);background:var(--accentbg)}
.slot.ok .misto{border-color:var(--ok);background:var(--okbg);border-style:solid}
.slot.bad .misto{border-color:var(--bad);background:var(--badbg);border-style:solid}
.slot .opr{grid-column:2;font-size:.85rem;color:var(--ok);font-weight:600}
.order{display:grid;gap:8px}
.order .ev{display:flex;align-items:center;gap:8px}
.order .ev .tx{flex:1}
.order .ev .ar{display:flex;gap:4px}
.order .ev .ar button{min-width:42px;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card2)}
.order .ev.ok{border-color:var(--ok);background:var(--okbg)} .order .ev.bad{border-color:var(--bad);background:var(--badbg)}
.order .ev.over{outline:3px dashed var(--accent)}
@media (min-width:820px){.tl-wrap{display:grid;grid-template-columns:1fr 1.25fr;gap:16px;align-items:start}.tl-wrap .tray{position:sticky;top:10px}}
/* spojovačka */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mi{text-align:left;min-height:54px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-size:.95rem;touch-action:manipulation}
.mi.sel{border-color:var(--accent);background:var(--accentbg)}
.mi.done{border-color:var(--ok);background:var(--okbg);opacity:.75}
.mi.wrong{animation:shake .35s;border-color:var(--bad);background:var(--badbg)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* kartičky */
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .front{font-size:1.35rem;font-weight:700}
.flash .back{font-size:1.08rem;margin-top:14px;text-align:left}
.flash .hint{margin-top:14px;font-size:.85rem;color:var(--muted)}
/* doplňovačka */
.cloze p{line-height:2.2;margin:0 0 10px}
input.blank{font:inherit;min-width:70px;padding:3px 8px;border:none;border-bottom:3px solid var(--accent);background:var(--accentbg);color:var(--text);border-radius:6px 6px 0 0;min-height:36px}
input.blank.ok{border-color:var(--ok);background:var(--okbg)}
input.blank.dia{border-color:var(--warn);background:var(--warnbg)}
input.blank.bad{border-color:var(--bad);background:var(--badbg)}
.corr{color:var(--ok);font-weight:700;font-size:.9rem;margin-left:4px}
/* křížovka */
.cw{display:grid;gap:3px;justify-content:center;margin:8px 0 14px;--c:min(34px,calc((min(100vw,920px) - 120px)/var(--sl,21)))}
.cw .r{display:grid;grid-auto-flow:column;grid-auto-columns:var(--c);gap:2px;cursor:pointer}
.cw .c{width:var(--c);height:var(--c);border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--c)*.5);border-radius:4px}
.cw .c.e{border:0;background:transparent}
.cw .c.sp{background:var(--line)}
.cw .c.n{border:0;background:transparent;color:var(--muted);font-size:calc(var(--c)*.42)}
.cw .c.t{background:var(--accentbg);border-color:var(--accent)}
.cw .r.sel .c:not(.e):not(.n){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cw .r.done .c:not(.e):not(.n):not(.t){background:var(--okbg)}
.clues{display:grid;gap:6px}
.clue{text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 12px;min-height:46px}
.clue.sel{border-color:var(--accent)} .clue.done{opacity:.6;text-decoration:line-through}
table.karta{width:100%;border-collapse:collapse}
table.karta td{border-top:1px solid var(--line);padding:9px 6px;vertical-align:top}
table.karta td:first-child{font-weight:700;width:34%}
.footer{margin-top:24px;text-align:center;font-size:.8rem;color:var(--muted)}
</style>
</head>

ntity | U) Stříbrný vítr |", "otazka": "Dílo o konfliktu dospívajícího s autoritami, první lásce a hledání identity?", "odpoved": "Stříbrný vítr", "pool": "dilo"}, {"id": "karticka-984e0b70", "tema": "Anarchističtí buřiči", "typ": "karticka", "doplneno": false, "zdroj": "Básník stojí ve tmě nad průmyslovým Městem a vidí, jak se z ulic vynořují zástupy chudých a zoufalých. Poznává v nich své „bratry a sestry“.", "kontext": "S. K. Neumann: Sen o zástupu zoufajících", "predni": "O čem je báseň?", "zadni": "Básník stojí ve tmě nad průmyslovým Městem a vidí, jak se z ulic vynořují zástupy chudých a zoufalých. Poznává v nich své „bratry a sestry“."}, {"id": "figura-b3e932d4", "tema": "Anarchističtí buřiči", "typ": "figura", "doplneno": true, "zdroj": "🟦 Gradace (klimax) se objevuje v úseku **b)** „a za ní druhá a jiné a jiné… do desítek, set a tisíců…“ (v zápisu nevyplněno).", "kontext": "S. K. Neumann: Sen o zástupu zoufajících", "ukazka": "„a za ní druhá a jiné a jiné… do desítek, set a tisíců…“", "figura": "gradace", "spravne": ["gradace"]}, {"id": "figura-f0594863", "tema": "Anarchističtí buřiči", "typ": "figura", "doplneno": false, "zdroj": "| b) V první sloce se neobjevuje žádné přirovnání. | N („jak bludičky bahen“) |", "kontext": "S. K. Neumann: Sen o zástupu zoufajících (první sloka)", "ukazka": "„jak bludičky bahen“", "figura": "přirovnání", "spravne": ["přirovnání"]}, {"id": "kviz-2a5d6c8d", "tema": "Petr Bezruč", "typ": "kviz", "doplneno": false, "zdroj": "Petr Bezruč je pseudonym básníka Vladimíra Vaška (1867 Opava – 🟦 1958). Je autorem jediné sbírky, **Slezské písně**. Je řazen k anarchistickým buřičům („básníci života a vzdoru“).", "otazka": "Jaké je občanské jméno Petra Bezruče?", "odpoved": "Vladimír Vašek", "pool": "autor", "bez": ["Petr Bezruč"]}, {"id": "kviz-fea6b65f", "tema": "Petr Bezruč", "typ": "kviz", "doplneno": false, "zdroj": "Petr Bezruč je pseudonym básníka Vladimíra Vaška (1867 Opava – 🟦 1958). Je autorem jediné sbírky, **Slezské písně**. Je řazen k anarchistickým buřičům („básníci života a vzdoru“).", "otazka": "Kde se narodil Petr Bezruč?", "odpoved": "Opava", "pool": "misto"}, {"id": "kviz-723cd18e", "tema": "Petr Bezruč", "typ": "kviz", "doplneno": false, "zdroj": "Petr Bezruč je pseudonym básníka Vladimíra Vaška (1867 Opava – 🟦 1958). Je autorem jediné sbírky, **Slezské písně**. Je řazen k anarchistickým buřičům („básníci života a vzdoru“).", "otazka": "Jak se jmenuje jediná sbírka Petra Bezruče?", "odpoved": "Slezské písně", "pool": "dilo", "bez": ["Petr Bezruč"]}, {"id": "doplnovacka-65b3fb1c", "tema": "Petr Bezruč", "typ": "doplnovacka", "doplneno": false, "zdroj": "- Ve Slezských písních se stylizuje do mluvčího chudého slezského lidu a hájí zájmy utlačovaných a vykořišťovaných. Velmi kriticky se vyjadřuje ke špatným sociálním poměrům Slezanů a přímo útočí na konkrétní vykořišťovatele. … - Otec byl učitel a slezský buditel. Označil Rukopisy královédvorský a zelenohorský za padělky a bránil český jazyk proti poněmčování. Kvůli tomu se rodina musela přestěhovat z Opavy do Brna (také německého, ale česká menšina tam měla silnější zázemí). … - Otec zemřel na tuberkulózu. Matka Marie zůstala sama s třináctiletým Vladimírem a jeho dalšími pěti sourozenci. … - Na gymnáziu se mu nedařilo v matematice, němčině a zpěvu (učitel mu říkal „Anton“, z něm. ein Ton = jeden tón). Proto byly jeho první básně ironické verše proti učitelům. … - Ve 14 letech se naučil rusky a četl Puškina v originále. … - Vysokou školu nedokončil. Učil ho T. G. Masaryk, setkal se s J. Herbenem a V. Mrštíkem. Prodělal psychické zhroucení. … - Pracoval jako písař, žil v apatii (alkohol, cigarety). Pak pracoval na poště a byl přeložen do Místku, což bylo pro jeho tvorbu klíčové. Jako poštovní úředník patřil k „honoraci“ (vyšší třídě), ale začal si všímat lidské bídy. … - Přítel Ondřej Boleslav Petr ho přivedl k sociální a národní otázce Slezska a seznámil ho s Maryčkou Sagonovou (nešťastná láska). Z jmen **Petr** a **Bezručová** (Doda Bezručová) vznikl pseudonym. O. B. Petr spáchal sebevraždu. … - Básně posílal Janu Herbenovi do časopisu Čas, pak vyšly knižně. Na přednášce bylo prozrazeno, kdo je autor. … - Báseň oslavující ruská vojska podepsaná „P. B.“ (nebyl jejím autorem) ho za 1. sv. války dostala do vězení kvůli velezradě, hrozil mu trest smrti. Byl zproštěn obvinění a nakonec propuštěn. … - Stranil se veřejnosti, chodil na túry. Zemřel v 90 letech, pohřben na opavském hřbitově.", "nazev": "Život Petra Bezruče", "radky": [{"doplneno": false, "zdroj": "- Ve Slezských písních se stylizuje do mluvčího chudého slezského lidu a hájí zájmy utlačovaných a vykořišťovaných. Velmi kriticky se vyjadřuje ke špatným sociálním poměrům Slezanů a přímo útočí na konkrétní vykořišťovatele.", "casti": ["Ve Slezských písních se stylizuje do mluvčího chudého slezského lidu a hájí zájmy ", {"m": "utlačovaných"}, " a vykořišťovaných. Velmi kriticky se vyjadřuje ke špatným sociálním poměrům Slezanů a přímo útočí na konkrétní ", {"m": "vykořišťovatele"}, "."]}, {"doplneno": false, "zdroj": "- Otec byl učitel a slezský buditel. Označil Rukopisy královédvorský a zelenohorský za padělky a bránil český jazyk proti poněmčování. Kvůli tomu se rodina musela přestěhovat z Opavy do Brna (také německého, ale česká menšina tam měla silnější zázemí).", "casti": ["Otec byl učitel a slezský ", {"m": "buditel"}, ". Označil Rukopisy královédvorský a zelenohorský za ", {"m": "padělky"}, " a bránil český jazyk proti poněmčování. Kvůli tomu se rodina musela přestěhovat z ", {"m": "Opavy"}, " do ", {"m": "Brna"}, " (také německého, ale česká menšina tam měla silnější zázemí)."]}, {"doplneno": false, "zdroj": "- Otec zemřel na tuberkulózu. Matka Marie zůstala sama s třináctiletým Vladimírem a jeho dalšími pěti sourozenci.", "casti": ["Otec zemřel na ", {"m": "tuberkulózu"}, ". Matka Marie zůstala sama s třináctiletým Vladimírem a jeho dalšími ", {"m": "pěti"}, " sourozenci."]}, {"doplneno": false, "zdroj": "- Na gymnáziu se mu nedař <script>
"use strict";
/* =====================================================================
   Procvičování češtiny k maturitě
   Veškerý obsah pochází z window.CESTINA_DATA (vygenerováno z dokumentu).
   V kódu není žádný obsah – jen texty rozhraní.
   Struktura:
     1) pomocné funkce   2) nastavení a statistiky   3) výběr položek
     4) tvorba otázek    5) obrazovky cvičení        6) úvodní obrazovka
   ===================================================================== */

const D = window.CESTINA_DATA;
const app = document.getElementById("app");

/* ---------------------------------------------------------- 1) pomocné */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TAG_D = '<span class="tag">doplněno</span>';
const TAG_R = '<span class="tag red">oprava</span>';
const fmt = s => esc(s).replace(/🟦\s*/g, TAG_D + " ").replace(/🟥\s*/g, TAG_R + " ").replace(/❓\s*/g, "");
/** u celé doplněné položky stačí jeden štítek – vnitřní značky 🟦 se nevykreslují */
const fmtI = (it, s) => it && it.doplneno ? fmt(String(s ?? "").replace(/🟦\s*/g, "")) : fmt(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const bezDia = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const nrm = s => String(s ?? "").replace(/🟦|🟥|❓/g, "").toLowerCase().replace(/[„“”"'‚‘’]/g, "")
  .replace(/[–—]/g, "-").replace(/\s+/g, " ").trim().replace(/^[.!?,;:\s]+|[.!?,;:\s]+$/g, "");
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function on(root, sel, ev, fn) { root.querySelectorAll(sel).forEach(x => x.addEventListener(ev, e => fn(e, x))); }

/** Porovnání psané odpovědi: "ok" | "dia" (chybí diakritika) | "bad" */
function porovnej(vstup, spravne, bezMezer) {
  let a = nrm(vstup), b = nrm(spravne);
  if (bezMezer) { a = a.replace(/\s/g, ""); b = b.replace(/\s/g, ""); }
  if (!a) return "bad";
  if (a === b) return "ok";
  if (bezDia(a) === bezDia(b)) return "dia";
  return "bad";
}

/** Zdroj (doslovný úryvek z dokumentu) – jen čitelnější zobrazení, obsah se nemění */
function fmtZdroj(z) {
  return String(z || "").split(" … ").map(part => {
    let p = part.trim().replace(/^#{2,3}\s*/, "").replace(/\*\*/g, "").replace(/\\\[/g, "[").replace(/\\\]/g, "]");
    if (p.startsWith("|")) p = p.replace(/^\|\s*|\s*\|$/g, "").split(/\s*\|\s*/).filter(Boolean).join("  ·  ");
    p = p.replace(/^-\s+/, "• ");
    return fmt(p);
  }).join("<br>");
}
const zdrojHtml = it => `<div class="zdroj"><b>Zdroj v zápisu</b> <span class="tag gray">${esc(it.tema)}</span><br>${fmtZdroj(it.zdroj)}</div>`;
const tagy = it => (it.doplneno ? " " + TAG_D : "") + (it.oprava ? " " + TAG_R : "");

/* ---------------------------------------------------------- 2) nastavení a statistiky */
const LS_S = "cestina-nastaveni-v1", LS_P = "cestina-postup-v1";
function nacti(k, def) { try { const v = localStorage.getItem(k); return v ? Object.assign(def, JSON.parse(v)) : def; } catch (e) { return def; } }
function uloz(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* soukromý režim apod. */ } }
const S = nacti(LS_S, { tema: "vse", rezim: "vse", motiv: "auto" });
const P = nacti(LS_P, { items: {} });   // id -> {ok, bad, t}
const ulozS = () => uloz(LS_S, S);

function zapis(item, ok) {
  const r = P.items[item.id] || (P.items[item.id] = { ok: 0, bad: 0, t: 0 });
  ok ? r.ok++ : r.bad++;
  r.t = Date.now();
  uloz(LS_P, P);
}
const BYID = Object.fromEntries((D ? D.polozky : []).map(p => [p.id, p]));

function statTemat() {
  const out = {};
  for (const t of D.meta.temata) out[t] = { ok: 0, bad: 0 };
  for (const [id, r] of Object.entries(P.items)) {
    const it = BYID[id]; if (!it || !out[it.tema]) continue;
    out[it.tema].ok += r.ok; out[it.tema].bad += r.bad;
  }
  return out;
}
function coMiNejde(limit = 12) {
  return Object.entries(P.items).map(([id, r]) => ({ it: BYID[id], r }))
    .filter(x => x.it && x.r.bad > 0 && x.r.bad >= x.r.ok)
    .sort((a, b) => (b.r.bad - b.r.ok) - (a.r.bad - a.r.ok) || b.r.t - a.r.t).slice(0, limit);
}

function aplikujMotiv() {
  if (S.motiv === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.motiv);
}

/* ---------------------------------------------------------- 3) výběr položek */
const muj = () => S.rezim === "muj";
/** Text pole podle režimu – v „Jen můj zápis“ bez doplněných částí */
const T = (it, f) => (muj() && it[f + "_muj"]) ? it[f + "_muj"] : it[f];
function polozky(typ, tema = S.tema) {
  return D.polozky.filter(p => (!typ || p.typ === typ) && (tema === "vse" || p.tema === tema) && (!muj() || !p.doplneno));
}

/** Distraktory z poolu dokumentu: stejné téma má přednost, v režimu „Jen můj zápis“ nedoplněné hodnoty */
function distraktory(pool, vyloucit, tema, n = 3) {
  const ex = new Set(vyloucit.map(nrm));
  const c = shuffle((D.pooly[pool] || []).filter(x => !ex.has(nrm(x.text))));
  const skore = x => (muj() && x.doplneno ? 2 : 0) + (x.tema === tema ? 0 : 1);
  c.sort((a, b) => skore(a) - skore(b));
  const out = [], seen = new Set();
  for (const x of c) { const k = nrm(x.text); if (!seen.has(k)) { seen.add(k); out.push(x.text); } if (out.length >= n) break; }
  return out;
}

/* ---------------------------------------------------------- 4) tvorba otázek
   Otázka = { item, prompt (HTML), druh: "volba"|"anone"|"text"|"sebe",
              moznosti[], spravne[] (přijímané odpovědi), ukaz (správná odpověď k zobrazení), extra (HTML) } */

// figury: citáty, které dokument přiřazuje víc figurám, uznají všechny přiřazené figury
const FIG_UZNAT = (() => {
  const figs = D ? D.polozky.filter(p => p.typ === "figura") : [];
  const q = p => nrm(p.ukazka.replace(/^.*?„/, "„").replace(/\(název básně\)/, ""));
  const m = {};
  for (const a of figs) {
    const s = new Set(a.spravne);
    for (const b of figs) { if (a === b) continue; const qa = q(a), qb = q(b); if (qa.length > 3 && qb.length > 3 && (qa.includes(qb) || qb.includes(qa))) b.spravne.forEach(x => s.add(x)); }
    m[a.id] = [...s];
  }
  return m;
})();
const PAR_REL = new Set(D ? D.polozky.filter(p => p.typ === "parovani").map(p => p.kategorie + "|" + nrm(p.levy) + "|" + nrm(p.pravy)) : []);

function volba(item, prompt, spravna, dis, extra) {
  if (dis.length < 3) return null;
  return { item, prompt, druh: "volba", moznosti: shuffle([spravna, ...dis.slice(0, 3)]), spravne: [spravna], ukaz: spravna, extra };
}
const ctx = s => s ? `<div class="ctx">${fmt(s)}</div>` : "";

function otazkaZ(item, varianta) {
  switch (item.typ) {
    case "kviz": {
      const dis = distraktory(item.pool, [item.odpoved, ...(item.vyloucit || []), ...(item.bez || [])], item.tema);
      return volba(item, `${ctx(item.kontext)}<div class="q">${fmt(item.otazka)}${tagy(item)}</div>`, item.odpoved, dis,
        item.vysvetleni ? `<div class="small">${fmtI(item, item.vysvetleni)}</div>` : "");
    }
    case "ano_ne":
      return { item, druh: "anone", moznosti: ["ANO", "NE"], spravne: [item.odpoved], ukaz: item.odpoved,
        prompt: `${ctx(item.kontext)}<div class="q">${fmt(item.tvrzeni)}${tagy(item)}</div>`,
        extra: (item.vysvetleni ? `<div>${fmt(item.vysvetleni)}</div>` : "") };
    case "figura": {
      const uzn = FIG_UZNAT[item.id] || item.spravne;
      const def = item.kontext === "Definice figury";
      const prompt = `${ctx(item.kontext)}${def ? `<div class="q">Který pojem odpovídá definici: ${fmt(item.ukazka)}?${tagy(item)}</div>`
        : `<blockquote>${fmt(item.ukazka)}</blockquote><div class="q">Jaká je to figura / prostředek?${tagy(item)}</div>`}`;
      const extra = item.poznamka ? `<div>${TAG_R} ${fmt(item.poznamka)}</div>` : "";
      if (varianta === "anafora") {
        return { item, prompt, druh: "volba", moznosti: ["anafora", "epifora"], spravne: uzn, ukaz: item.figura, extra };
      }
      const q = volba(item, prompt, item.figura, distraktory("figura", uzn, item.tema), extra);
      if (q) q.spravne = uzn;
      return q;
    }
    case "smer_ukazka": {
      const prompt = `<div class="ctx">Poznej směr podle ukázky</div><h3>${fmt(item.nazev)}${tagy(item)}</h3>
        <ul class="clean">${item.popis.map(x => `<li>${fmt(x)}</li>`).join("")}</ul><div class="q">Ke kterému směru ukázka patří?</div>`;
      return volba(item, prompt, item.odpoved, distraktory("smer", [item.odpoved, ...item.spravne], item.tema));
    }
    case "karta": {
      const sous = polozky("karta", "vse").filter(p => p.tema === item.tema && p.druh === item.druh && p.id !== item.id);
      if (item.druh === "kategorie") {
        if (varianta === "obraceně" || (varianta !== "rovně" && Math.random() < .4)) {
          return volba(item, `<div class="ctx">Maturitní karta – ${esc(item.tema)}</div><blockquote>${fmt(T(item, "obsah"))}</blockquote>
            <div class="q">Ke které kategorii karty to patří?${tagy(item)}</div>`, item.kategorie, shuffle(sous).map(p => p.kategorie));
        }
        return volba(item, `<div class="ctx">Maturitní karta – ${esc(item.tema)}</div><div class="q">${esc(item.kategorie)}: co sem patří?${tagy(item)}</div>`,
          T(item, "obsah"), shuffle(sous).map(p => T(p, "obsah")));
      }
      if (item.druh === "postava") {
        return volba(item, `<div class="ctx">Postavy – ${esc(item.tema)}</div><div class="q">Která postava: ${fmt(T(item, "popis"))}?${tagy(item)}</div>`,
          item.postava, shuffle(sous).map(p => p.postava));
      }
      return null;
    }
    case "casova_osa": {
      const ost = shuffle(D.polozky.filter(p => p.typ === "casova_osa" && p.osa === item.osa && p.rok !== item.rok && (!muj() || !p.doplneno)));
      const roky = [...new Set(ost.map(p => p.rok))];
      return volba(item, `<div class="ctx">${esc(item.osa)}</div><div class="q">Zvol správný rok: ${fmt(item.udalost)}${tagy(item)}</div>`, item.rok, roky,
        item.poznamka ? `<div class="small">${fmt(item.poznamka)}</div>` : "");
    }
    case "parovani": {
      const ost = shuffle(D.polozky.filter(p => p.typ === "parovani" && p.kategorie === item.kategorie && !PAR_REL.has(p.kategorie + "|" + nrm(item.levy) + "|" + nrm(p.pravy))));
      const dis = [...new Set(ost.map(p => p.pravy))].filter(x => nrm(x) !== nrm(item.pravy));
      return volba(item, `<div class="ctx">Spojovačka: ${esc(item.kategorie)}</div><div class="q">Co patří k: ${fmt(item.levy)}?${tagy(item)}</div>`, item.pravy, dis);
    }
    case "karticka":
      return { item, druh: "sebe", prompt: `${ctx(item.kontext)}<div class="q">${fmt(item.predni)}${tagy(item)}</div>`, odpovedHtml: zadniKarticky(item) };
    case "doplnovacka": {
      const radky = item.radky.filter(r => !muj() || !r.doplneno);
      const kand = radky.filter(r => r.casti.some(c => typeof c !== "string"));
      if (!kand.length) return null;
      const r = pick(kand);
      const mezery = r.casti.filter(c => typeof c !== "string");
      const m = pick(mezery);
      const html = r.casti.map(c => typeof c === "string" ? fmt(c) : (c === m ? "<b>_____</b>" : esc(c.m))).join("");
      return { item, druh: "text", spravne: [m.m], ukaz: m.m, prompt: `<div class="ctx">Doplň vynechané slovo – ${esc(item.nazev)}</div><blockquote style="font-style:normal">${html}</blockquote>${tagy(item)}`, zdrojRadek: r.zdroj };
    }
    case "krizovka": {
      const r = pick(item.radky);
      return { item, druh: "text", spravne: [r.odpoved], ukaz: r.odpoved, bezMezer: true,
        prompt: `<div class="ctx">${esc(item.nazev)}</div><div class="q">${fmt(r.napoveda)}</div><div class="small muted">${r.odpoved.replace(/\s/g, "").length} písmen</div>`, zdrojRadek: r.zdroj };
    }
  }
  return null;
}

function zadniKarticky(it) {
  let h = "";
  if (it.seznam) {
    const s = it.seznam.map(p => muj() ? p.muj : p.t).filter(Boolean);
    h = `<ul class="clean">${s.map(x => `<li>${fmtI(it, x)}</li>`).join("")}</ul>`;
  } else h = `<div>${fmtI(it, T(it, "zadni"))}</div>`;
  if (it.doplnek && !muj()) h += `<div class="small" style="margin-top:6px">${TAG_D} ${fmt(it.doplnek.replace(/🟦\s*/g, ""))}</div>`;
  return h;
}

function popis(it) {
  const t = { kviz: it.otazka, ano_ne: it.tvrzeni, figura: it.ukazka, karta: it.kategorie || it.postava || it.tema, karticka: it.predni,
    casova_osa: it.udalost, parovani: it.levy + " ↔ " + it.pravy, doplnovacka: it.nazev, krizovka: it.nazev, smer_ukazka: it.nazev }[it.typ];
  return String(t || it.id).replace(/🟦\s*/g, "");
}
function odpovedText(it) {
  const t = { kviz: it.odpoved, ano_ne: it.odpoved, figura: it.figura, karta: it.postava || T(it, "obsah"), karticka: T(it, "zadni") || "",
    casova_osa: it.rok, parovani: it.pravy, smer_ukazka: it.odpoved, doplnovacka: "", krizovka: "" }[it.typ];
  return String(t || "").replace(/🟦\s*/g, "");
}

/* ---------------------------------------------------------- 5) obrazovky */
function hlavicka(nazev, podnazev) {
  return `<div class="top"><button class="btn ghost sm" data-home>← Domů</button><div class="grow"><h1 style="font-size:1.2rem">${esc(nazev)}</h1>
    ${podnazev ? `<div class="small muted">${esc(podnazev)}</div>` : ""}</div></div>`;
}
const filtrPopis = () => (S.tema === "vse" ? "Všechna témata" : S.tema) + " · " + (muj() ? "jen můj zápis" : "vše včetně doplněného");
function render(node) {
  app.innerHTML = "";
  app.appendChild(node);
  on(node, "[data-home]", "click", () => domu());
  window.scrollTo(0, 0);
}
function prazdne(nazev, text) {
  render(el(`<div>${hlavicka(nazev, filtrPopis())}<div class="card">${esc(text)}</div></div>`));
}

/* ----- souhrn kola */
function souhrn(nazev, vysledky, znovu, noveKolo) {
  const ok = vysledky.filter(v => v.ok).length, n = vysledky.length;
  const chyby = vysledky.filter(v => !v.ok);
  const pct = n ? Math.round(ok / n * 100) : 0;
  const node = el(`<div>${hlavicka(nazev, "Konec kola")}
    <div class="card"><div class="row"><div class="big-score">${ok} / ${n}</div><div class="muted">${pct} % správně</div></div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="row">${chyby.length ? `<button class="btn primary" data-chyby>Procvič znovu jen chyby (${chyby.length})</button>` : ""}
      ${noveKolo ? `<button class="btn" data-nove>Nové kolo</button>` : ""}<button class="btn ghost" data-home>Domů</button></div></div>
    ${chyby.length ? `<div class="card"><h2>Chyby</h2><div class="list-err">${chyby.map(v => `<div class="err">
       <div><b>${fmt(popis(v.item))}</b>${tagy(v.item)}</div>
       ${v.tvoje ? `<div class="small">Tvoje odpověď: ${fmt(v.tvoje)}</div>` : ""}
       ${v.spravne || odpovedText(v.item) ? `<div class="small">Správně: <b>${fmt(v.spravne || odpovedText(v.item))}</b></div>` : ""}
       ${zdrojHtml(v.item)}</div>`).join("")}</div></div>` : `<div class="card">Bez chyby. 🎉</div>`}
  </div>`);
  render(node);
  on(node, "[data-chyby]", "click", () => znovu([...new Map(chyby.map(v => [v.item.id, v.item])).values()]));
  on(node, "[data-nove]", "click", () => noveKolo());
}

/* ----- obecné kolo otázek (výběr z možností, ANO/NE, psaní, sebehodnocení) */
function kolo(nazev, otazky, znovu, noveKolo) {
  otazky = otazky.filter(Boolean);
  if (!otazky.length) return prazdne(nazev, "Pro zvolený filtr tu nejsou žádné otázky. Zkus jiné téma nebo režim „Vše včetně doplněného“.");
  const vysledky = [];
  let i = 0;
  const krok = () => {
    if (i >= otazky.length) return souhrn(nazev, vysledky, znovu, noveKolo);
    const q = otazky[i];
    const node = el(`<div>${hlavicka(nazev, filtrPopis())}
      <div class="small muted">Otázka ${i + 1} / ${otazky.length} · správně ${vysledky.filter(v => v.ok).length}</div>
      <div class="progress"><i style="width:${i / otazky.length * 100}%"></i></div>
      <div class="card" id="qc">${q.prompt}<div id="ans"></div><div id="fb"></div></div></div>`);
    render(node);
    const ans = node.querySelector("#ans"), fb = node.querySelector("#fb");
    const hotovo = (ok, tvoje, warn) => {
      zapis(q.item, ok);
      vysledky.push({ item: q.item, ok, tvoje, spravne: q.ukaz });
      fb.innerHTML = `<div class="fb ${ok ? "ok" : "bad"}"><div class="t">${ok ? "✓ Správně" : "✗ Špatně"}</div>
        ${warn ? `<div class="warn">Pozor na diakritiku – správně: ${esc(q.ukaz)}</div>` : ""}
        ${!ok && q.ukaz ? `<div>Správná odpověď: <b>${fmt(q.ukaz)}</b></div>` : ""}
        ${q.extra || ""}
        ${q.zdrojRadek ? `<div class="zdroj"><b>Zdroj v zápisu</b><br>${fmtZdroj(q.zdrojRadek)}</div>` : zdrojHtml(q.item)}
        <div class="row" style="margin-top:10px"><button class="btn primary" id="dal">${i + 1 < otazky.length ? "Další →" : "Vyhodnotit"}</button></div></div>`;
      const dal = fb.querySelector("#dal");
      dal.addEventListener("click", () => { i++; krok(); });
      dal.focus({ preventScroll: true });
      fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
    if (q.druh === "volba" || q.druh === "anone") {
      ans.innerHTML = `<div class="${q.druh === "anone" ? "yn" : "opts" + (q.moznosti.every(m => m.length < 40) ? " two" : "")}">
        ${q.moznosti.map((m, k) => `<button class="opt" data-k="${k}">${fmt(m)}</button>`).join("")}</div>`;
      on(ans, ".opt", "click", (e, b) => {
        const m = q.moznosti[+b.dataset.k];
        const ok = q.spravne.some(s => nrm(s) === nrm(m));
        ans.querySelectorAll(".opt").forEach((x, k) => { x.disabled = true; if (q.spravne.some(s => nrm(s) === nrm(q.moznosti[k]))) x.classList.add("ok"); });
        if (!ok) b.classList.add("bad");
        hotovo(ok, ok ? null : m);
      });
    } else if (q.druh === "text") {
      ans.innerHTML = `<div class="row"><input class="txt" id="t" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Napiš odpověď"><button class="btn primary" id="ch">Zkontrolovat</button></div>`;
      const t = ans.querySelector("#t");
      const go = () => {
        if (!t.value.trim()) return t.focus();
        const r = q.spravne.map(s => porovnej(t.value, s, q.bezMezer)).sort((a, b) => ["ok", "dia", "bad"].indexOf(a) - ["ok", "dia", "bad"].indexOf(b))[0];
        t.disabled = true; ans.querySelector("#ch").disabled = true;
        t.classList.add(r === "bad" ? "bad" : "ok");
        hotovo(r !== "bad", r === "bad" ? t.value : null, r === "dia");
      };
      ans.querySelector("#ch").addEventListener("click", go);
      t.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      setTimeout(() => t.focus(), 50);
    } else if (q.druh === "sebe") {
      ans.innerHTML = `<button class="btn primary" id="uk">Ukázat odpověď</button>`;
      ans.querySelector("#uk").addEventListener("click", () => {
        ans.innerHTML = `<div class="fb" style="background:var(--card2)">${q.odpovedHtml}</div>
          <div class="yn" style="margin-top:12px"><button class="opt" data-v="0">Neumím</button><button class="opt" data-v="1">Umím</button></div>`;
        on(ans, ".opt", "click", (e, b) => { ans.querySelectorAll(".opt").forEach(x => x.disabled = true); hotovo(b.dataset.v === "1"); });
      });
    }
  };
  krok();
}

/* ----- jednotlivá cvičení */
const KOLO = 15;

function cvKviz(items) {
  const src = items || polozky("kviz");
  kolo("Kvíz s výběrem z možností", shuffle(src).slice(0, items ? 999 : KOLO).map(it => otazkaZ(it)), x => cvKviz(x), () => cvKviz());
}
function cvAnoNe(items) {
  const src = items || polozky("ano_ne");
  kolo("ANO / NE", shuffle(src).slice(0, items ? 999 : KOLO).map(it => otazkaZ(it)), x => cvAnoNe(x), () => cvAnoNe());
}
function cvSmer(items) {
  const src = items || polozky("smer_ukazka");
  kolo("Poznej směr podle ukázky", shuffle(src).map(it => otazkaZ(it)), x => cvSmer(x), () => cvSmer());
}
function cvFigury(varianta, items) {
  if (!varianta) {
    const vse = polozky("figura"), ae = vse.filter(p => p.spravne.some(s => s === "anafora" || s === "epifora"));
    const node = el(`<div>${hlavicka("Básnické figury", filtrPopis())}<div class="card"><h2>Co chceš procvičit?</h2>
      <div class="grid"><button class="ex" data-v="vse" ${vse.length ? "" : "disabled"}><b>Všechny figury</b><span class="small muted">Citát z dokumentu → urči figuru</span><span class="n">${vse.length} položek</span></button>
      <button class="ex" data-v="anafora" ${ae.length ? "" : "disabled"}><b>Anafora × epifora</b><span class="small muted">Zvlášť: začátek × konec veršů (oprava v zápisu)</span><span class="n">${ae.length} položek</span></button></div></div></div>`);
    render(node);
    return on(node, "[data-v]", "click", (e, b) => cvFigury(b.dataset.v));
  }
  let src = items || polozky("figura");
  if (varianta === "anafora" && !items) src = src.filter(p => p.spravne.some(s => s === "anafora" || s === "epifora"));
  kolo(varianta === "anafora" ? "Anafora × epifora" : "Básnické figury", shuffle(src).slice(0, items ? 999 : KOLO).map(it => otazkaZ(it, varianta)),
    x => cvFigury(varianta, x), () => cvFigury(varianta));
}
function cvKarticky(items) {
  const deck = shuffle(items || polozky("karticka")).slice(0, items ? 999 : 20);
  if (!deck.length) return prazdne("Kartičky", "Pro zvolený filtr tu nejsou žádné kartičky.");
  const fronta = deck.slice(), prvni = new Map(), vysledky = [];
  let otoceno = false;
  const krok = () => {
    if (!fronta.length) return souhrn("Kartičky", deck.map(it => ({ item: it, ok: prvni.get(it.id) })), x => cvKarticky(x), () => cvKarticky());
    const it = fronta[0];
    otoceno = false;
    const node = el(`<div>${hlavicka("Kartičky", filtrPopis())}
      <div class="small muted">Zbývá ${fronta.length} · hotovo ${deck.length - new Set(fronta.map(x => x.id)).size} / ${deck.length}</div>
      <div class="progress"><i style="width:${(deck.length - new Set(fronta.map(x => x.id)).size) / deck.length * 100}%"></i></div>
      <div class="card flash" id="fc">${ctx(it.kontext)}<div class="front">${fmt(it.predni)}</div><div>${tagy(it)}</div>
        <div class="back" hidden>${zadniKarticky(it)}${zdrojHtml(it)}</div><div class="hint">Klepni pro otočení</div></div>
      <div class="yn"><button class="opt" data-v="0">Neumím</button><button class="opt" data-v="1">Umím</button></div></div>`);
    render(node);
    const fc = node.querySelector("#fc");
    fc.addEventListener("click", () => { otoceno = !otoceno; fc.querySelector(".back").hidden = !otoceno; fc.querySelector(".hint").hidden = otoceno; });
    on(node, "[data-v]", "click", (e, b) => {
      const umim = b.dataset.v === "1";
      if (!prvni.has(it.id)) { prvni.set(it.id, umim); zapis(it, umim); }
      fronta.shift();
      if (!umim) fronta.splice(Math.min(3, fronta.length), 0, it);   // „Neumím“ se brzy zopakuje
      krok();
    });
  };
  krok();
}
function cvKarta(items) {
  const vse = polozky("karta");
  const temata = [...new Set(vse.map(p => p.tema))];
  if (!vse.length) return prazdne("Maturitní karta", "Pro zvolený filtr tu není žádná maturitní karta.");
  if (items) return kolo("Maturitní karta", shuffle(items).map(it => otazkaZ(it)), x => cvKarta(x), () => cvKarta());
  const node = el(`<div>${hlavicka("Maturitní karta", filtrPopis())}${temata.map(t => {
    const xs = vse.filter(p => p.tema === t);
    return `<div class="card"><h2>${esc(t)}</h2><div class="row">
      <button class="btn primary" data-t="${esc(t)}" data-m="rovně">Kategorie → obsah</button>
      <button class="btn" data-t="${esc(t)}" data-m="obraceně">Obsah → kategorie</button>
      <button class="btn" data-t="${esc(t)}" data-m="postavy">Postavy</button>

/* ----- drag & drop (pointer events – myš i dotyk) */
function tahatelne(node, { onTap, onDrop, cil = ".drop" }) {
  node.addEventListener("pointerdown", e => {
    if (e.button > 0 || e.target.closest("button")) return;
    const sx = e.clientX, sy = e.clientY, rect = node.getBoundingClientRect();
    let ghost = null, over = null;
    try { node.setPointerCapture(e.pointerId); } catch (_) {}
    const najdi = (x, y) => { const t = document.elementFromPoint(x, y); return t && t.closest(cil); };
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
        ghost = node.cloneNode(true); ghost.classList.add("drag-ghost"); ghost.style.width = rect.width + "px";
        document.body.appendChild(ghost); node.classList.add("dragging");
      }
      if (!ghost) return;
      ev.preventDefault();
      ghost.style.left = (ev.clientX - (sx - rect.left)) + "px";
      ghost.style.top = (ev.clientY - (sy - rect.top)) + "px";
      const t = najdi(ev.clientX, ev.clientY);
      if (t !== over) { over && over.classList.remove("over"); over = t; over && over !== node && over.classList.add("over"); }
      if (ev.clientY < 70) window.scrollBy(0, -14); else if (ev.clientY > innerHeight - 70) window.scrollBy(0, 14);
    };
    const konec = (ev, zrus) => {
      node.removeEventListener("pointermove", move); node.removeEventListener("pointerup", up); node.removeEventListener("pointercancel", cancel);
      over && over.classList.remove("over");
      if (ghost) { ghost.remove(); node.classList.remove("dragging"); if (!zrus) { const t = najdi(ev.clientX, ev.clientY); if (t && t !== node) onDrop(t, ev); } }
      else if (!zrus && onTap) onTap();
    };
    const up = ev => konec(ev, false), cancel = ev => konec(ev, true);
    node.addEventListener("pointermove", move); node.addEventListener("pointerup", up); node.addEventListener("pointercancel", cancel);
  });
}

/* ----- spojovačka */
function cvParovani(kategorie, items) {
  const vse = polozky("parovani");
  const kats = [...new Set(vse.map(p => p.kategorie))];
  if (!vse.length) return prazdne("Spojovačka", "Pro zvolený filtr tu nejsou žádné dvojice.");
  if (!kategorie) {
    const node = el(`<div>${hlavicka("Spojovačka", filtrPopis())}<div class="card"><h2>Co chceš spojovat?</h2><div class="grid">
      ${kats.map(k => `<button class="ex" data-k="${esc(k)}"><b>${esc(k)}</b><span class="n">${vse.filter(p => p.kategorie === k).length} dvojic</span></button>`).join("")}
      ${kats.length > 1 ? `<button class="ex" data-k="*"><b>Všechno dohromady</b><span class="n">${vse.length} dvojic</span></button>` : ""}</div></div></div>`);
    render(node);
    return on(node, "[data-k]", "click", (e, b) => cvParovani(b.dataset.k));
  }
  const zdroj = shuffle(items || vse.filter(p => kategorie === "*" || p.kategorie === kategorie));
  // sestavení tabulí po 6 dvojicích – bez dvojznačností (žádný levý se nehodí k cizímu pravému)
  const tabule = [], zbyva = zdroj.slice();
  while (zbyva.length && tabule.length < 3) {
    const t = [];
    for (let k = 0; k < zbyva.length && t.length < 6; k++) {
      const p = zbyva[k];
      const kolize = t.some(q => nrm(q.levy) === nrm(p.levy) || nrm(q.pravy) === nrm(p.pravy)
        || PAR_REL.has(q.kategorie + "|" + nrm(q.levy) + "|" + nrm(p.pravy)) || PAR_REL.has(p.kategorie + "|" + nrm(p.levy) + "|" + nrm(q.pravy)));
      if (!kolize) { t.push(p); zbyva.splice(k, 1); k--; }
    }
    if (!t.length) break;
    tabule.push(t);
  }
  const chyba = new Set(), vysl = [];
  const nazev = "Spojovačka – " + (kategorie === "*" ? "vše" : kategorie);
  let ti = 0;
  const krok = () => {
    if (ti >= tabule.length) return souhrn(nazev, vysl, x => cvParovani(kategorie, x), () => cvParovani(kategorie));
    const t = tabule[ti], L = shuffle(t), R = shuffle(t);
    const node = el(`<div>${hlavicka(nazev, filtrPopis())}<div class="small muted">Tabule ${ti + 1} / ${tabule.length} · klepni vlevo a pak vpravo</div>
      <div class="progress"><i style="width:${ti / tabule.length * 100}%"></i></div>
      <div class="match"><div class="col">${L.map(p => `<button class="mi" data-s="L" data-id="${p.id}">${fmt(p.levy)}${tagy(p)}</button>`).join("")}</div>
      <div class="col">${R.map(p => `<button class="mi" data-s="R" data-id="${p.id}">${fmt(p.pravy)}</button>`).join("")}</div></div><div id="fb"></div></div>`);
    render(node);
    let sel = null, hotovych = 0;
    on(node, ".mi", "click", (e, b) => {
      if (b.classList.contains("done")) return;
      if (!sel || sel.dataset.s === b.dataset.s) { sel && sel.classList.remove("sel"); sel = b; b.classList.add("sel"); return; }
      const l = sel.dataset.s === "L" ? sel : b, r = sel.dataset.s === "R" ? sel : b;
      const pl = BYID[l.dataset.id], pr = BYID[r.dataset.id];
      const ok = l.dataset.id === r.dataset.id || PAR_REL.has(pl.kategorie + "|" + nrm(pl.levy) + "|" + nrm(pr.pravy));
      sel.classList.remove("sel"); sel = null;
      if (ok) {
        l.classList.add("done"); r.classList.add("done"); hotovych++;
        if (hotovych === t.length) {
          for (const p of t) { const o = !chyba.has(p.id); zapis(p, o); vysl.push({ item: p, ok: o }); }
          node.querySelector("#fb").innerHTML = `<div class="fb ok"><div class="t">Tabule hotová</div><div class="row" style="margin-top:8px"><button class="btn primary" id="dal">${ti + 1 < tabule.length ? "Další tabule →" : "Vyhodnotit"}</button></div></div>`;
          node.querySelector("#dal").addEventListener("click", () => { ti++; krok(); });
        }
      } else {
        chyba.add(pl.id);
        [l, r].forEach(x => { x.classList.remove("wrong"); void x.offsetWidth; x.classList.add("wrong"); setTimeout(() => x.classList.remove("wrong"), 600); });
      }
    });
  };
  krok();
}

/* ----- křížovka */
function cvKrizovka() {

    if (idx < 0 && taj) idx = [...bezDia(slovo)].indexOf(bezDia(taj[k]));
    return { ...r, slovo, idx: Math.max(0, idx), hotovo: false, spatne: 0 };

        const j = x - off;
        if (j < 0 || j >= r.slovo.length) { cells += `<div class="c e"></div>`; continue; }
        const ch = r.slovo[j];
        cells += ch === " " ? `<div class="c sp"></div>` : `<div class="c ${j === r.idx && taj ? "t" : ""}">${r.hotovo ? esc(ch) : ""}</div>`;
      }
      return `<div class="r ${k === sel ? "sel" : ""} ${r.hotovo ? "done" : ""}" data-k="${k}">${cells}</div>`;
    }).join("");
    node.querySelector("#cl").innerHTML = radky.map((r, k) => `<button class="clue ${k === sel ? "sel" : ""} ${r.hotovo ? "done" : ""}" data-k="${k}"><b>${esc(r.c)}.</b> ${fmt(r.napoveda)}</button>`).join("");
    const r = radky[sel];
    node.querySelector("#panel").innerHTML = r.hotovo ? `<div class="fb ok"><b>${esc(r.c)}. ${esc(r.odpoved)}</b> ✓</div>` :
      `<div class="ctx">${esc(r.c)}. (${r.slovo.replace(/\s/g, "").length} písmen)</div><div class="q" style="font-size:1.05rem">${fmt(r.napoveda)}</div>
       <div class="row"><input class="txt" id="t" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Odpověď"><button class="btn primary" id="ok">Potvrdit</button></div><div id="msg"></div>`;
    on(node, "[data-k]", "click", (e, b) => { sel = +b.dataset.k; kresli(); });
    const t = node.querySelector("#t");
    if (t) {
      const go = () => {
        const v = porovnej(t.value, r.odpoved, true);
        if (v === "bad") { r.spatne++; node.querySelector("#msg").innerHTML = `<div class="fb bad">✗ To není ono, zkus to znovu.</div>`; return; }
        r.hotovo = true;
        const dalsi = radky.findIndex(x => !x.hotovo);
        if (dalsi >= 0) sel = dalsi;
        kresli();
        if (v === "dia") alertDia(r.odpoved);
        if (dalsi < 0) konec(false);
      };
      node.querySelector("#ok").addEventListener("click", go);
      t.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    }
  };
  const alertDia = s => node.querySelector("#panel").insertAdjacentHTML("afterbegin", `<div class="warn" style="margin-bottom:8px">Uznáno, ale pozor na diakritiku – správně: ${esc(s)}</div>`);
  const konec = (vzdal) => {
    radky.forEach(r => r.hotovo = true); kresli();
    const ok = !vzdal && radky.every(r => r.spatne === 0);
    zapis(it, ok);
    node.querySelector("#vzdat").remove();
    node.querySelector("#fb").innerHTML = `<div class="fb ${ok ? "ok" : "bad"}"><div class="t">${vzdal ? "Řešení zobrazeno" : ok ? "Hotovo bez chyby!" : "Hotovo"}</div>
      ${taj ? `<div>Tajenka: <b>${esc(it.tajenka)}</b></div>` : ""}<div>Chybných pokusů: ${radky.reduce((a, r) => a + r.spatne, 0)}</div>
      ${zdrojHtml(it)}<div class="row" style="margin-top:10px"><button class="btn primary" id="zn">Znovu</button><button class="btn ghost" data-home>Domů</button></div></div>`;
    on(node, "[data-home]", "click", () => domu());
    node.querySelector("#zn").addEventListener("click", () => cvKrizovka());
  };
  node.querySelector("#vzdat").addEventListener("click", () => konec(true));
  kresli();
}

/* ----- rychlý mix a „co mi nejde“ */
const MIX_TYPY = ["kviz", "ano_ne", "figura", "smer_ukazka", "karta", "doplnovacka", "casova_osa", "parovani", "krizovka"];
function rychlyMix(items) {
  let otazky = [];
  if (items) otazky = shuffle(items).map(it => otazkaZ(it));
  else {
    const podle = {};
    for (const t of MIX_TYPY) { const xs = polozky(t).filter(p => p.typ !== "karta" || p.druh !== "dej"); if (xs.length) podle[t] = shuffle(xs); }
    const typy = Object.keys(podle);
    let pokusy = 0;
    while (otazky.length < KOLO && typy.length && pokusy++ < 200) {
      const t = pick(typy), it = podle[t].pop();
      if (!podle[t].length) typy.splice(typy.indexOf(t), 1);
      const q = it && otazkaZ(it);
      if (q) otazky.push(q);
    }
  }
  kolo(items ? "Procvičení chyb" : "Rychlý mix", otazky, x => rychlyMix(x), items ? null : () => rychlyMix());
}

/* ---------------------------------------------------------- 6) úvodní obrazovka */
const CVICENI = [
  { typ: "casova_osa", nazev: "Časová osa", popis: "Doplňovačka na roky a seřazení událostí", fn: () => cvOsa() },
  { typ: "parovani", nazev: "Spojovačka", popis: "Autor ↔ dílo, směr, vynález, pojem ↔ definice", fn: () => cvParovani() },
  { typ: "smer_ukazka", nazev: "Poznej směr podle ukázky", popis: "Ukázka z dokumentu → směr", fn: () => cvSmer() },
  { typ: "figura", nazev: "Básnické figury", popis: "Citát → figura, zvlášť anafora × epifora", fn: () => cvFigury() },
  { typ: "ano_ne", nazev: "ANO / NE", popis: "Tvrzení z tabulek a rozboru básně", fn: () => cvAnoNe() },
  { typ: "kviz", nazev: "Kvíz", popis: "4 možnosti ze všech témat", fn: () => cvKviz() },
  { typ: "karta", nazev: "Maturitní karta", popis: "Válka s mloky – kategorie, postavy, celá karta", fn: () => cvKarta() },
  { typ: "karticka", nazev: "Kartičky", popis: "Umím / Neumím, neumím se brzy zopakuje", fn: () => cvKarticky() },
  { typ: "doplnovacka", nazev: "Doplňovačka do textu", popis: "Souvislý text s vynechanými slovy", fn: () => cvDoplnovacka() },
  { typ: "krizovka", nazev: "Křížovka", popis: "Anarchističtí buřiči – tajenka", fn: () => cvKrizovka() },
];

function domu() {
  const st = statTemat();
  const temata = D.meta.temata;
  const radky = temata.map(t => { const s = st[t], n = s.ok + s.bad; return { t, n, pct: n ? Math.round(s.ok / n * 100) : null }; });
  const slabe = radky.filter(r => r.n >= 3).sort((a, b) => a.pct - b.pct).slice(0, 3).filter(r => r.pct < 100);
  const nejde = coMiNejde();
  const barva = p => p === null ? "var(--line)" : p >= 80 ? "var(--ok)" : p >= 50 ? "var(--warn)" : "var(--bad)";
  const node = el(`<div>
    <div class="top"><div class="grow"><h1>Čeština k maturitě</h1><div class="small muted">Procvičování z tvého zápisu</div></div>
      <button class="btn sm" id="motiv" title="Světlý / tmavý režim">${S.motiv === "dark" ? "☾ Tmavý" : S.motiv === "light" ? "☀ Světlý" : "◐ Podle systému"}</button></div>
    <div class="card"><h3>Téma</h3><div class="chips" id="tm">
      <button class="chip ${S.tema === "vse" ? "on" : ""}" data-t="vse">Vše</button>
      ${temata.map(t => `<button class="chip ${S.tema === t ? "on" : ""}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
      <h3 style="margin-top:14px">Obsah</h3><div class="seg" id="rz"><button data-r="muj" class="${muj() ? "on" : ""}">Jen můj zápis</button><button data-r="vse" class="${!muj() ? "on" : ""}">Vše včetně doplněného</button></div>
      <div class="small muted" style="margin-top:6px">Doplněné položky (nebyly v tvém zápisu) mají štítek ${TAG_D}</div></div>
    <button class="btn primary mix" id="mix">⚡ Rychlý mix – ${KOLO} náhodných otázek</button>
    <div style="height:14px"></div>
    <div class="grid">${CVICENI.map((c, k) => { const n = polozky(c.typ).length; return `<button class="ex" data-c="${k}" ${n ? "" : "disabled"}><b>${esc(c.nazev)}</b><span class="small muted">${esc(c.popis)}</span><span class="n">${n} položek</span></button>`; }).join("")}</div>
    <div style="height:14px"></div>
    <div class="card"><h2>Tvůj postup</h2>
      ${slabe.length ? `<div class="weak"><b>Nejslabší:</b> ${slabe.map(r => `${esc(r.t)} (${r.pct} %)`).join(" · ")}
         <div class="row" style="margin-top:8px">${slabe.map(r => `<button class="btn sm" data-slabe="${esc(r.t)}">Procvičit: ${esc(r.t)}</button>`).join("")}</div></div>`
        : `<div class="small muted">Až odpovíš na pár otázek, uvidíš tu, kde jsi nejslabší.</div>`}
      ${radky.map(r => `<div class="stat"><span>${esc(r.t)}</span><span class="bar"><i style="width:${r.pct ?? 0}%;background:${barva(r.pct)}"></i></span><span class="small muted">${r.pct === null ? "–" : r.pct + " %"}</span></div>`).join("")}
      ${nejde.length ? `<h3 style="margin-top:14px">Co mi nejde</h3><ul class="clean small">${nejde.map(x => `<li>${fmt(popis(x.it))} <span class="muted">(${x.r.bad}× špatně)</span></li>`).join("")}</ul>
        <button class="btn" id="nejde">Procvičit, co mi nejde</button>` : ""}
      <div style="margin-top:12px"><button class="btn ghost sm" id="reset">Vymazat postup</button></div></div>
    <div class="footer">Obsah: ${esc(D.meta.zdroj_soubor)} · ${D.meta.pocet} položek · vygenerováno ${esc(D.meta.vygenerovano)}</div></div>`);
  render(node);
  on(node, "[data-t]", "click", (e, b) => { S.tema = b.dataset.t; ulozS(); domu(); });
  on(node, "[data-r]", "click", (e, b) => { S.rezim = b.dataset.r; ulozS(); domu(); });
  on(node, "[data-c]", "click", (e, b) => CVICENI[+b.dataset.c].fn());
  on(node, "[data-slabe]", "click", (e, b) => { S.tema = b.dataset.slabe; ulozS(); rychlyMix(); });
  node.querySelector("#mix").addEventListener("click", () => rychlyMix());
  node.querySelector("#motiv").addEventListener("click", () => { S.motiv = { auto: "light", light: "dark", dark: "auto" }[S.motiv]; ulozS(); aplikujMotiv(); domu(); });
  const nj = node.querySelector("#nejde"); nj && nj.addEventListener("click", () => rychlyMix(nejde.map(x => x.it)));
  node.querySelector("#reset").addEventListener("click", () => { if (confirm("Opravdu vymazat celý postup?")) { P.items = {}; uloz(LS_P, P); domu(); } });
}

/* ---------------------------------------------------------- start */
aplikujMotiv();
if (!D) app.innerHTML = '<div class="card">Chybí data. Spusť <code>python3 nastroje/generuj_data.py</code>.</div>';
else {
  if (S.tema !== "vse" && !D.meta.temata.includes(S.tema)) S.tema = "vse";
  domu();
}
</script>
</body>
